[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroopt"
version = "0.1.1"
description = "Reproducible two-dimensional multielement airfoil geometry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2,<3", "shapely>=2.0.7,<3", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

